<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYRO WEAR — Complete Business Management System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js for Reactive State Management -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0B0B0C',
            cardDark: '#141416',
            silverAccent: '#C0C0C0',
            silverLight: '#E5E4E2'
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0B0B0C;
      color: #F8F9FA;
      font-family: system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0B0B0C; }
    ::-webkit-scrollbar-thumb { background: #333338; border-radius: 2px; }
  </style>
</head>
<body x-data="vyroApp()" x-init="initApp()" class="min-h-screen bg-obsidian text-zinc-100 pb-20 md:pb-0">

  <!-- ================= 1. AUTHENTICATION SCREEN ================= -->
  <div x-show="!isAuthenticated" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-cardDark border border-zinc-800 rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-3xl font-black tracking-widest text-silverAccent">VYRO WEAR</h1>
        <p class="text-[10px] tracking-widest text-zinc-400 uppercase">ELEVATE YOUR EVERYDAY.</p>
      </div>
      
      <form @submit.prevent="login()" class="space-y-4">
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Owner Email</label>
          <input type="email" x-model="loginEmail" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:border-silverAccent outline-none">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Password</label>
          <input type="password" x-model="loginPassword" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:border-silverAccent outline-none">
        </div>
        <button type="submit" class="w-full py-3.5 bg-silverAccent text-black font-bold rounded-xl hover:bg-white transition-all text-sm tracking-wide shadow-lg">
          <span x-text="lang === 'bn' ? 'প্রবেশ করুন (Login)' : 'Secure Login'"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= 2. MAIN APPLICATION ================= -->
  <div x-show="isAuthenticated" class="min-h-screen flex flex-col md:flex-row" style="display: none;">
    
    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-cardDark border-r border-zinc-800 p-6 sticky top-0 h-screen shadow-2xl">
      <div class="mb-8">
        <h1 class="text-xl font-bold tracking-widest text-silverAccent">VYRO WEAR</h1>
        <p class="text-[9px] tracking-wider text-zinc-400 uppercase">ELEVATE YOUR EVERYDAY.</p>
      </div>
      <nav class="space-y-1.5 flex-1 overflow-y-auto pr-1">
        <template x-for="item in menuItems" :key="item.id">
          <button @click="activeTab = item.id" 
                  :class="activeTab === item.id ? 'bg-silverAccent text-black font-bold shadow-md' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'" 
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs transition-all">
            <i :class="item.icon" class="text-base w-5"></i>
            <span x-text="lang === 'bn' ? item.bn : item.en"></span>
          </button>
        </template>
      </nav>
      <div class="pt-4 border-t border-zinc-800 flex items-center justify-between">
        <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="text-xs text-zinc-400 hover:text-white flex items-center gap-2">
          <i class="fa-solid fa-globe"></i> <span x-text="lang === 'bn' ? 'English' : 'বাংলা'"></span>
        </button>
        <button @click="isAuthenticated = false" class="text-red-400 hover:text-red-300 p-2">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT BODY -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
      
      <!-- MOBILE HEADER -->
      <header class="flex justify-between items-center mb-6 pb-4 border-b border-zinc-800 md:hidden">
        <div>
          <h1 class="text-lg font-bold tracking-widest text-silverAccent">VYRO WEAR</h1>
          <p class="text-[8px] text-zinc-400 tracking-wider uppercase">ELEVATE YOUR EVERYDAY.</p>
        </div>
        <div class="flex items-center gap-3">
          <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="text-xs bg-zinc-800 px-2.5 py-1.5 rounded-lg text-zinc-300 font-medium">
            <span x-text="lang === 'bn' ? 'EN' : 'বাং'"></span>
          </button>
          <button @click="isAuthenticated = false" class="text-red-400 p-1">
            <i class="fa-solid fa-right-from-bracket text-base"></i>
          </button>
        </div>
      </header>

      <!-- TAB 1: DASHBOARD -->
      <div x-show="activeTab === 'dashboard'" class="space-y-6">
        <h2 class="text-xl font-bold text-silverAccent" x-text="lang === 'bn' ? 'বিজনেস ড্যাশবোর্ড' : 'Business Dashboard'"></h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-cardDark border border-zinc-800 rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-400" x-text="lang === 'bn' ? 'মোট বিক্রি' : 'Total Sales'"></p>
            <h4 class="text-lg font-bold text-white mt-1">৳ <span x-text="getTotalSales().toLocaleString()"></span></h4>
          </div>
          <div class="bg-cardDark border border-zinc-800 rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-400" x-text="lang === 'bn' ? 'মোট খরচ' : 'Total Expenses'"></p>
            <h4 class="text-lg font-bold text-white mt-1">৳ <span x-text="getTotalExpenses().toLocaleString()"></span></h4>
          </div>
          <div class="bg-cardDark border border-zinc-800 rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-400" x-text="lang === 'bn' ? 'মোট অর্ডার' : 'Total Orders'"></p>
            <h4 class="text-lg font-bold text-white mt-1" x-text="orders.length"></h4>
          </div>
          <div class="bg-cardDark border rounded-2xl p-4 shadow-sm" :class="getLowStockCount() > 0 ? 'border-red-500/50' : 'border-zinc-800'">
            <p class="text-xs text-zinc-400" x-text="lang === 'bn' ? 'লো স্টক' : 'Low Stock'"></p>
            <h4 class="text-lg font-bold text-white mt-1" x-text="getLowStockCount()"></h4>
          </div>
        </div>

        <div class="bg-cardDark border border-zinc-800 rounded-2xl p-5 space-y-3">
          <h3 class="text-sm font-semibold text-silverAccent" x-text="lang === 'bn' ? 'সাম্প্রতিক অর্ডারসমূহ' : 'Recent Orders'"></h3>
          <template x-for="order in orders.slice(0, 5)" :key="order.id">
            <div class="flex justify-between items-center bg-zinc-900/60 p-3 rounded-xl border border-zinc-800 text-xs">
              <div>
                <p class="font-bold text-white">#<span x-text="order.invoiceNo"></span> - <span x-text="order.customerName"></span></p>
                <p class="text-zinc-400"><span x-text="order.productName"></span> (<span x-text="order.phone"></span>)</p>
              </div>
              <div class="text-right">
                <p class="font-bold text-silverAccent">৳ <span x-text="order.grandTotal"></span></p>
                <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-medium" x-text="order.status"></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 2: ORDERS -->
      <div x-show="activeTab === 'orders'" class="space-y-6" style="display: none;">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-silverAccent" x-text="lang === 'bn' ? 'অর্ডার ম্যানেজমেন্ট' : 'Order Management'"></h2>
          <button @click="showOrderModal = true" class="bg-silverAccent text-black font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-white transition-all">
            + <span x-text="lang === 'bn' ? 'নতুন অর্ডার' : 'New Order'"></span>
          </button>
        </div>

        <div class="space-y-3">
          <template x-for="order in orders" :key="order.id">
            <div class="bg-cardDark border border-zinc-800 rounded-2xl p-4 flex justify-between items-center text-xs">
              <div>
                <p class="font-bold text-white text-sm">#<span x-text="order.invoiceNo"></span> - <span x-text="order.customerName"></span></p>
                <p class="text-zinc-400"><span x-text="order.productName"></span> | Qty: <span x-text="order.quantity"></span> | <span x-text="order.phone"></span></p>
              </div>
              <div class="text-right space-y-1">
                <p class="text-sm font-bold text-silverAccent">৳ <span x-text="order.grandTotal"></span></p>
                <select x-model="order.status" @change="saveData()" class="bg-zinc-900 text-zinc-300 border border-zinc-800 text-[10px] px-2 py-1 rounded-lg outline-none">
                  <option value="Pending">Pending</option>
                  <option value="Confirmed">Confirmed</option>
                  <option value="Processing">Processing</option>
                  <option value="Shipped">Shipped</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 3: PRODUCTS -->
      <div x-show="activeTab === 'products'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-silverAccent" x-text="lang === 'bn' ? 'প্রোডাক্ট ম্যানেজমেন্ট' : 'Product Management'"></h2>
        <form @submit.prevent="addProduct()" class="bg-cardDark border border-zinc-800 p-4 rounded-2xl grid grid-cols-1 md:grid-cols-4 gap-3">
          <input type="text" x-model="newProd.name" placeholder="Product Name" required class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white outline-none">
          <input type="number" x-model="newProd.price" placeholder="Selling Price (BDT)" required class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white outline-none">
          <input type="number" x-model="newProd.stock" placeholder="Initial Stock" required class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white outline-none">
          <button type="submit" class="bg-silverAccent text-black font-bold rounded-xl text-xs py-3">Add Product</button>
        </form>

        <div class="space-y-3">
          <template x-for="p in products" :key="p.id">
            <div class="bg-cardDark border border-zinc-800 p-4 rounded-2xl flex justify-between items-center text-xs">
              <div>
                <p class="font-bold text-white text-sm" x-text="p.name"></p>
                <p class="text-zinc-400">SKU: <span x-text="p.sku"></span> | Stock: <span x-text="p.stock"></span> pcs</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-silverAccent">৳ <span x-text="p.price"></span></span>
                <button @click="deleteProduct(p.id)" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash text-sm"></i></button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 4: INVENTORY -->
      <div x-show="activeTab === 'inventory'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-silverAccent" x-text="lang === 'bn' ? 'ইনভেন্টরি ট্র্যাকিং' : 'Inventory Tracking'"></h2>
        <div class="space-y-3">
          <template x-for="p in products" :key="p.id">
            <div class="bg-cardDark border border-zinc-800 p-4 rounded-2xl flex justify-between items-center text-xs">
              <span class="font-bold text-white text-sm" x-text="p.name"></span>
              <span class="px-3 py-1 rounded-full font-bold" :class="p.stock <= 5 ? 'bg-red-500/20 text-red-400' : 'bg-zinc-900 text-silverAccent'">
                <span x-text="p.stock"></span> units available
              </span>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 5: EXPENSES -->
      <div x-show="activeTab === 'expenses'" class="space-y-6" style="display:
