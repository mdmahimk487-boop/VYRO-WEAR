<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYRO WEAR — Complete Business Management System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            studioBg: '#FAFAFA',
            cardWhite: '#FFFFFF',
            silverBorder: '#E4E4E7',
            silverAccent: '#71717A',
            obsidian: '#09090B'
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #FAFAFA;
      color: #09090B;
      font-family: system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #FAFAFA; }
    ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 2px; }
  </style>
</head>
<body x-data="vyroApp()" x-init="initApp()" class="min-h-screen bg-studioBg text-obsidian pb-20 md:pb-0">

  <!-- ================= 1. AUTHENTICATION SCREEN (STRICT OWNER SECURITY) ================= -->
  <div x-show="!isAuthenticated" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-cardWhite border border-silverBorder rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-2xl bg-obsidian text-white flex items-center justify-center font-black text-xl mx-auto shadow-md">
          VY
        </div>
        <h1 class="text-2xl font-black tracking-widest text-obsidian uppercase">VYRO WEAR</h1>
        <p class="text-[10px] tracking-widest text-zinc-500 uppercase font-semibold">Elevate Your Everyday.</p>
      </div>
      
      <div x-show="authError" class="bg-red-50 border border-red-200 text-red-600 text-xs p-3.5 rounded-xl flex items-center gap-2 font-medium">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span x-text="authError"></span>
      </div>

      <form @submit.prevent="login()" class="space-y-4">
        <div>
          <label class="text-xs text-zinc-600 block mb-1 font-semibold">Owner Email</label>
          <input type="email" x-model="loginEmail" required placeholder="owner@vyrowear.com" class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-sm text-obsidian focus:border-obsidian outline-none">
        </div>
        <div>
          <label class="text-xs text-zinc-600 block mb-1 font-semibold">Password</label>
          <input type="password" x-model="loginPassword" required placeholder="••••••••" class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-sm text-obsidian focus:border-obsidian outline-none">
        </div>
        <button type="submit" class="w-full py-3.5 bg-obsidian text-white font-bold rounded-xl hover:bg-zinc-800 transition-all text-sm tracking-wide shadow-lg">
          <span x-text="lang === 'bn' ? 'সুরক্ষিত প্রবেশ (Secure Login)' : 'Secure Owner Login'"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= 2. MAIN APPLICATION ================= -->
  <div x-show="isAuthenticated" class="min-h-screen flex flex-col md:flex-row" style="display: none;">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="hidden md:flex flex-col w-64 bg-cardWhite border-r border-silverBorder p-6 sticky top-0 h-screen shadow-sm">
      <div class="mb-8 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-obsidian text-white flex items-center justify-center font-bold text-sm">VY</div>
        <div>
          <h1 class="text-base font-black tracking-widest text-obsidian uppercase">VYRO WEAR</h1>
          <p class="text-[8px] tracking-wider text-zinc-400 uppercase font-bold">Elevate Your Everyday</p>
        </div>
      </div>
      <nav class="space-y-1.5 flex-1 overflow-y-auto">
        <template x-for="item in menuItems" :key="item.id">
          <button @click="activeTab = item.id" 
                  :class="activeTab === item.id ? 'bg-obsidian text-white font-bold shadow-md' : 'text-zinc-600 hover:bg-zinc-100 hover:text-obsidian'" 
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs transition-all">
            <i :class="item.icon" class="text-base w-5"></i>
            <span x-text="lang === 'bn' ? item.bn : item.en"></span>
          </button>
        </template>
      </nav>
      <div class="pt-4 border-t border-silverBorder flex items-center justify-between">
        <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="text-xs text-zinc-600 font-bold hover:text-obsidian flex items-center gap-2">
          <i class="fa-solid fa-globe"></i> <span x-text="lang === 'bn' ? 'English' : 'বাংলা'"></span>
        </button>
        <button @click="isAuthenticated = false" class="text-red-500 hover:text-red-700 p-2">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT BODY -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
      
      <!-- MOBILE HEADER -->
      <header class="flex justify-between items-center mb-6 pb-4 border-b border-silverBorder md:hidden">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-obsidian text-white flex items-center justify-center font-black text-xs">VY</div>
          <div>
            <h1 class="text-sm font-black tracking-widest text-obsidian uppercase">VYRO WEAR</h1>
            <p class="text-[7px] text-zinc-400 tracking-wider uppercase font-bold">Elevate Your Everyday</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button @click="lang = lang === 'bn' ? 'en' : 'bn'" class="text-xs bg-zinc-100 border border-silverBorder px-2.5 py-1.5 rounded-lg text-obsidian font-bold">
            <span x-text="lang === 'bn' ? 'EN' : 'বাং'"></span>
          </button>
          <button @click="isAuthenticated = false" class="text-red-500 p-1">
            <i class="fa-solid fa-right-from-bracket text-base"></i>
          </button>
        </div>
      </header>

      <!-- TAB 1: DASHBOARD -->
      <div x-show="activeTab === 'dashboard'" class="space-y-6">
        <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'বিজনেস ড্যাশবোর্ড' : 'Business Dashboard'"></h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-cardWhite border border-silverBorder rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-500" x-text="lang === 'bn' ? 'মোট বিক্রি' : 'Total Sales'"></p>
            <h4 class="text-lg font-bold text-obsidian mt-1">৳ <span x-text="getTotalSales().toLocaleString()"></span></h4>
          </div>
          <div class="bg-cardWhite border border-silverBorder rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-500" x-text="lang === 'bn' ? 'মোট খরচ' : 'Total Expenses'"></p>
            <h4 class="text-lg font-bold text-obsidian mt-1">৳ <span x-text="getTotalExpenses().toLocaleString()"></span></h4>
          </div>
          <div class="bg-cardWhite border border-silverBorder rounded-2xl p-4 shadow-sm">
            <p class="text-xs text-zinc-500" x-text="lang === 'bn' ? 'মোট অর্ডার' : 'Total Orders'"></p>
            <h4 class="text-lg font-bold text-obsidian mt-1" x-text="orders.length"></h4>
          </div>
          <div class="bg-cardWhite border rounded-2xl p-4 shadow-sm" :class="getLowStockCount() > 0 ? 'border-red-400 bg-red-50/50' : 'border-silverBorder'">
            <p class="text-xs text-zinc-500" x-text="lang === 'bn' ? 'লো স্টক' : 'Low Stock'"></p>
            <h4 class="text-lg font-bold text-obsidian mt-1" x-text="getLowStockCount()"></h4>
          </div>
        </div>

        <div class="bg-cardWhite border border-silverBorder rounded-2xl p-5 space-y-3 shadow-sm">
          <h3 class="text-sm font-bold text-obsidian" x-text="lang === 'bn' ? 'সাম্প্রতিক অর্ডারসমূহ' : 'Recent Orders'"></h3>
          <template x-for="order in orders.slice(0, 5)" :key="order.id">
            <div class="flex justify-between items-center bg-zinc-50 p-3 rounded-xl border border-silverBorder text-xs">
              <div class="flex items-center gap-3">
                <img :src="order.productImage || 'https://via.placeholder.com/50'" class="w-10 h-10 rounded-lg object-cover border border-silverBorder">
                <div>
                  <p class="font-bold text-obsidian">#<span x-text="order.invoiceNo"></span> - <span x-text="order.customerName"></span></p>
                  <p class="text-zinc-500"><span x-text="order.productName"></span> (Qty: <span x-text="order.quantity"></span>)</p>
                </div>
              </div>
              <div class="text-right">
                <p class="font-bold text-obsidian">৳ <span x-text="order.grandTotal"></span></p>
                <span class="text-[10px] px-2 py-0.5 rounded font-bold" :class="order.status === 'Cancelled' ? 'bg-red-100 text-red-600' : 'bg-zinc-200 text-obsidian'" x-text="order.status"></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 2: ORDERS -->
      <div x-show="activeTab === 'orders'" class="space-y-6" style="display: none;">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'অর্ডার ম্যানেজমেন্ট' : 'Order Management'"></h2>
          <button @click="showOrderModal = true" class="bg-obsidian text-white font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-zinc-800 transition-all">
            + <span x-text="lang === 'bn' ? 'নতুন অর্ডার' : 'New Order'"></span>
          </button>
        </div>

        <div class="space-y-3">
          <template x-for="order in orders" :key="order.id">
            <div class="bg-cardWhite border border-silverBorder rounded-2xl p-4 flex justify-between items-center text-xs shadow-sm">
              <div class="flex items-center gap-3">
                <img :src="order.productImage || 'https://via.placeholder.com/50'" class="w-12 h-12 rounded-xl object-cover border border-silverBorder">
                <div>
                  <p class="font-bold text-obsidian text-sm">#<span x-text="order.invoiceNo"></span> - <span x-text="order.customerName"></span></p>
                  <p class="text-zinc-500"><span x-text="order.productName"></span> | Qty: <span x-text="order.quantity"></span> | <span x-text="order.phone"></span></p>
                </div>
              </div>
              <div class="text-right space-y-1">
                <p class="text-sm font-bold text-obsidian">৳ <span x-text="order.grandTotal"></span></p>
                <select x-model="order.status" @change="updateOrderStatus(order)" class="bg-zinc-50 text-obsidian border border-silverBorder text-[10px] px-2 py-1 rounded-lg outline-none font-bold">
                  <option value="Pending">Pending</option>
                  <option value="Confirmed">Confirmed</option>
                  <option value="Shipped">Shipped</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 3: PRODUCTS -->
      <div x-show="activeTab === 'products'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'প্রোডাক্ট ম্যানেজমেন্ট' : 'Product Management'"></h2>
        
        <form @submit.prevent="addProduct()" class="bg-cardWhite border border-silverBorder p-4 rounded-2xl space-y-3 shadow-sm">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="text" x-model="newProd.name" placeholder="Product Name" required class="bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
            <input type="number" x-model="newProd.price" placeholder="Selling Price (BDT)" required class="bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
            <input type="number" x-model="newProd.stock" placeholder="Initial Stock Qty" required class="bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
          </div>
          <div class="flex items-center gap-3">
            <input type="file" @change="handleImageUpload($event)" accept="image/*" class="text-xs text-zinc-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-100 file:text-obsidian hover:file:bg-zinc-200">
            <button type="submit" class="bg-obsidian text-white font-bold rounded-xl text-xs px-6 py-3 ml-auto">Add Product</button>
          </div>
          <template x-if="newProd.image">
            <img :src="newProd.image" class="w-16 h-16 rounded-xl object-cover border border-silverBorder">
          </template>
        </form>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <template x-for="p in products" :key="p.id">
            <div class="bg-cardWhite border border-silverBorder p-4 rounded-2xl flex justify-between items-center text-xs shadow-sm">
              <div class="flex items-center gap-3">
                <img :src="p.image || 'https://via.placeholder.com/50'" class="w-12 h-12 rounded-xl object-cover border border-silverBorder">
                <div>
                  <p class="font-bold text-obsidian text-sm" x-text="p.name"></p>
                  <p class="text-zinc-500">SKU: <span x-text="p.sku"></span> | Stock: <span x-text="p.stock"></span> pcs</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-obsidian">৳ <span x-text="p.price"></span></span>
                <button @click="deleteProduct(p.id)" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash text-sm"></i></button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 4: INVENTORY -->
      <div x-show="activeTab === 'inventory'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'ইনভেন্টরি ট্র্যাকিং' : 'Inventory Tracking'"></h2>
        <div class="space-y-3">
          <template x-for="p in products" :key="p.id">
            <div class="bg-cardWhite border border-silverBorder p-4 rounded-2xl flex justify-between items-center text-xs shadow-sm">
              <div class="flex items-center gap-3">
                <img :src="p.image || 'https://via.placeholder.com/50'" class="w-10 h-10 rounded-xl object-cover border border-silverBorder">
                <span class="font-bold text-obsidian text-sm" x-text="p.name"></span>
              </div>
              <span class="px-3 py-1 rounded-full font-bold" :class="p.stock <= 5 ? 'bg-red-100 text-red-600' : 'bg-zinc-100 text-obsidian'">
                <span x-text="p.stock"></span> units remaining
              </span>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 5: EXPENSES -->
      <div x-show="activeTab === 'expenses'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'খরচসমূহ' : 'Expenses'"></h2>
        <form @submit.prevent="addExpense()" class="bg-cardWhite border border-silverBorder p-4 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-3 shadow-sm">
          <input type="text" x-model="newExp.desc" placeholder="Expense Description" required class="bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
          <input type="number" x-model="newExp.amount" placeholder="Amount (BDT)" required class="bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
          <button type="submit" class="bg-obsidian text-white font-bold rounded-xl text-xs py-3">Record Expense</button>
        </form>
        <div class="space-y-3">
          <template x-for="e in expenses" :key="e.id">
            <div class="bg-cardWhite border border-silverBorder p-4 rounded-2xl flex justify-between items-center text-xs shadow-sm">
              <span class="text-obsidian font-semibold" x-text="e.desc"></span>
              <span class="text-red-500 font-bold">৳ <span x-text="e.amount"></span></span>
            </div>
          </template>
        </div>
      </div>

      <!-- TAB 6: PROFIT & LOSS -->
      <div x-show="activeTab === 'finance'" class="space-y-6" style="display: none;">
        <h2 class="text-xl font-bold text-obsidian" x-text="lang === 'bn' ? 'লাভ ও ক্ষতি হিসাব' : 'Profit & Loss'"></h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-cardWhite border border-silverBorder p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-zinc-500">Total Revenue</p>
            <h3 class="text-xl font-bold text-obsidian mt-1">৳ <span x-text="getTotalSales().toLocaleString()"></span></h3>
          </div>
          <div class="bg-cardWhite border border-silverBorder p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-zinc-500">Total Expenses</p>
            <h3 class="text-xl font-bold text-red-500 mt-1">৳ <span x-text="getTotalExpenses().toLocaleString()"></span></h3>
          </div>
          <div class="bg-cardWhite border border-silverBorder p-5 rounded-2xl shadow-sm">
            <p class="text-xs text-zinc-500">Net Business Profit</p>
            <h3 class="text-xl font-bold mt-1" :class="getNetProfit() >= 0 ? 'text-green-600' : 'text-red-500'">৳ <span x-text="getNetProfit().toLocaleString()"></span></h3>
          </div>
        </div>
      </div>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-cardWhite border-t border-silverBorder flex justify-around py-3 px-2 z-50 shadow-lg">
      <template x-for="item in menuItems" :key="item.id">
        <button @click="activeTab = item.id" :class="activeTab === item.id ? 'text-obsidian font-bold' : 'text-zinc-400'" class="flex flex-col items-center gap-1">
          <i :class="item.icon" class="text-base"></i>
          <span class="text-[9px]" x-text="lang === 'bn' ? item.bn : item.en"></span>
        </button>
      </template>
    </nav>
  </div>

  <!-- ORDER CREATION MODAL -->
  <div x-show="showOrderModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" style="display: none;">
    <div class="bg-cardWhite border border-silverBorder rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-obsidian" x-text="lang === 'bn' ? 'নতুন অর্ডার তৈরি করুন' : 'Create New Order'"></h3>
      <form @submit.prevent="createOrder()" class="space-y-3">
        <input type="text" x-model="newOrder.customerName" placeholder="Customer Name" required class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
        <input type="text" x-model="newOrder.phone" placeholder="Phone Number" required class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none">
        
        <!-- AUTO PRODUCT SELECTION & PRICE POPULATION -->
        <select x-model="newOrder.selectedProduct" @change="onProductSelect()" required class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none font-semibold">
          <option value="">Select Product</option>
          <template x-for="p in products" :key="p.id">
            <option :value="p.id" x-text="p.name + ' (Stock: ' + p.stock + ') - ৳' + p.price"></option>
          </template>
        </select>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-zinc-500 font-bold block mb-0.5">Unit Selling Price</label>
            <input type="number" x-model="newOrder.unitPrice" placeholder="Selling Price" required class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none font-bold">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 font-bold block mb-0.5">Quantity</label>
            <input type="number" x-model="newOrder.quantity" min="1" placeholder="Qty" required class="w-full bg-zinc-50 border border-silverBorder rounded-xl p-3 text-xs text-obsidian outline-none font-bold">
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-obsidian text-white font-bold py-3 rounded-xl text-xs">Save Order</button>
          <button type="button" @click="showOrderModal = false" class="px-4 bg-zinc-100 text-obsidian rounded-xl text-xs font-bold">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONTROLLER SCRIPT -->
  <script>
    function vyroApp() {
      return {
        isAuthenticated: false,
        loginEmail: '',
        loginPassword: '',
        authError: '',
        activeTab: 'dashboard',
        lang: 'bn',
        showOrderModal: false,

        // STRICT OWNER CREDENTIALS
        OWNER_EMAIL: 'owner@vyrowear.com',
        OWNER_PASS: 'vyro1234',

        menuItems: [
          { id: 'dashboard', bn: 'ড্যাশবোর্ড', en: 'Dashboard', icon: 'fa-solid fa-chart-pie' },
          { id: 'orders', bn: 'অর্ডার', en: 'Orders', icon: 'fa-solid fa-bag-shopping' },
          { id: 'products', bn: 'প্রোডাক্ট', en: 'Products', icon: 'fa-solid fa-box' },
          { id: 'inventory', bn: 'স্টক', en: 'Inventory', icon: 'fa-solid fa-layer-group' },
          { id: 'expenses', bn: 'খরচ', en: 'Expenses', icon: 'fa-solid fa-receipt' },
          { id: 'finance', bn: 'লাভ-ক্ষতি', en: 'Profit', icon: 'fa-solid fa-scale-balanced' }
        ],

        products: [],
        orders: [],
        expenses: [],

        newProd: { name: '', price: '', stock: '', image: '' },
        newExp: { desc: '', amount: '' },
        newOrder: { customerName: '', phone: '', selectedProduct: '', unitPrice: '', quantity: 1 },

        initApp() {
          const savedProducts = localStorage.getItem('vyro_products');
          const savedOrders = localStorage.getItem('vyro_orders');
          const savedExpenses = localStorage.getItem('vyro_expenses');

          this.products = savedProducts ? JSON.parse(savedProducts) : [
            { id: '1', name: 'Oversized Noir Hoodie', sku: 'VYRO-HD-01', price: 2490, stock: 15, image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=300' }
          ];
          this.orders = savedOrders ? JSON.parse(savedOrders) : [];
          this.expenses = savedExpenses ? JSON.parse(savedExpenses) : [];
        },

        login() {
          if (this.loginEmail.trim().toLowerCase() === this.OWNER_EMAIL && this.loginPassword === this.OWNER_PASS) {
            this.isAuthenticated = true;
            this.authError = '';
          } else {
            this.authError = 'ভুল ইমেইল অথবা পাসওয়ার্ড! শুধুমাত্র রেজিস্টার্ড ওনার প্রবেশ করতে পারবেন।';
          }
        },

        saveData() {
          localStorage.setItem('vyro_products', JSON.stringify(this.products));
          localStorage.setItem('vyro_orders', JSON.stringify(this.orders));
          localStorage.setItem('vyro_expenses', JSON.stringify(this.expenses));
        },

        handleImageUpload(event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.newProd.image = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        },

        addProduct() {
          this.products.push({
            id: Date.now().toString(),
            name: this.newProd.name,
            sku: 'VYRO-' + Math.floor(100 + Math.random() * 900),
            price: Number(this.newProd.price),
            stock: Number(this.newProd.stock),
            image: this.newProd.image || 'https://via.placeholder.com/150'
          });
          this.saveData();
          this.newProd = { name: '', price: '', stock: '', image: '' };
        },

        deleteProduct(id) {
          this.products = this.products.filter(p => p.id !== id);
          this.saveData();
        },

        onProductSelect() {
          const prod = this.products.find(p => p.id === this.newOrder.selectedProduct);
          if (prod) {
            this.newOrder.unitPrice = prod.price;
          }
        },

        createOrder() {
          const prod = this.products.find(p => p.id === this.newOrder.selectedProduct);
          if (!prod) return;

          const qty = Number(this.newOrder.quantity);

          if (prod.stock < qty) {
            alert(`ইনভেন্টরিতে পর্যাপ্ত স্টক নেই! বর্তমান স্টক: ${prod.stock} টি।`);
            return;
          }

          // Strict Individual Stock Deduction
          prod.stock -= qty;

          const grandTotal = (Number(this.newOrder.unitPrice) * qty) + 100;
          this.orders.unshift({
            id: Date.now().toString(),
            invoiceNo: Math.floor(100000 + Math.random() * 900000),
            customerName: this.newOrder.customerName,
            phone: this.newOrder.phone,
            productName: prod.name,
            productImage: prod.image,
            quantity: qty,
            grandTotal: grandTotal,
            status: 'Pending'
          });

          this.saveData();
          this.showOrderModal = false;
          this.newOrder = { customerName: '', phone: '', selectedProduct: '', unitPrice: '', quantity: 1 };
        },

        updateOrderStatus(order) {
          if (order.status === 'Cancelled') {
            const prod = this.products.find(p => p.name === order.productName);
            if (prod) {
              prod.stock += Number(order.quantity);
            }
          }
          this.saveData();
        },

        addExpense() {
          this.expenses.unshift({
            id: Date.now().toString(),
            desc: this.newExp.desc,
            amount: Number(this.newExp.amount)
          });
          this.saveData();
          this.newExp = { desc: '', amount: '' };
        },

        getTotalSales() {
          return this.orders.filter(o => o.status !== 'Cancelled').reduce((acc, o) => acc + Number(o.grandTotal || 0), 0);
        },

        getTotalExpenses() {
          return this.expenses.reduce((acc, e) => acc + Number(e.amount || 0), 0);
        },

        getNetProfit() {
          return this.getTotalSales() - this.getTotalExpenses();
        },

        getLowStockCount() {
          return this.products.filter(p => Number(p.stock) <= 5).length;
        }
      }
    }
  </script>
</body>
