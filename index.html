<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO WEAR PRO — Enterprise Fashion ERP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX Execution -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #090d16; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function VyroWearApp() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

            // Mock State for Modules
            const [products, setProducts] = React.useState([
                { id: 1, name: 'Premium Oversized Hoodie', sku: 'VW-HD-BLK-M', category: 'Hoodie', price: 1850, stock: 24, size: 'M', color: 'Black' },
                { id: 2, name: 'Couple Hoodie Set', sku: 'VW-CHD-RED-L', category: 'Couple Hoodie', price: 3400, stock: 10, size: 'L', color: 'Red' }
            ]);

            const [orders, setOrders] = React.useState([
                { id: 'VW-1001', customer: 'রাহিম আহমেদ', phone: '01700000000', address: 'ঢাকা, বাংলাদেশ', total: 1850, status: 'পেন্ডিং', channel: 'Facebook' },
                { id: 'VW-1002', customer: 'তানভির হোসেন', phone: '01800000000', address: 'চট্টগ্রাম', total: 3400, status: 'কনফার্মড', channel: 'Offline Shop' }
            ]);

            const [expenses, setExpenses] = React.useState([
                { id: 1, title: 'ফেসবুক এড কস্ট', category: 'Marketing', amount: 2500, date: '2026-11-08' },
                { id: 2, title: 'প্যাকেজিং ব্যাগ ক্রয়', category: 'Packaging', amount: 1200, date: '2026-11-07' }
            ]);

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar Navigation */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 border-r border-slate-800 transform ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between`}>
                        <div className="p-5 overflow-y-auto">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-black text-white tracking-wider">VYRO WEAR <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">PRO</span></h1>
                                <button onClick={() => setMobileMenuOpen(false)} className="md:hidden text-slate-400">✕</button>
                            </div>
                            <p className="text-xs text-slate-500 mt-1">ফ্যাশন ইআরপি ও বিজনেস সিস্টেম</p>

                            <nav className="mt-6 space-y-1">
                                <NavItem id="dashboard" icon="📊" label="ড্যাশবোর্ড (Dashboard)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="products" icon="👕" label="পণ্য ও ভ্যারিয়েন্ট (Products)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="inventory" icon="🏭" label="স্টক ও ইনভেন্টরি (Inventory)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="orders" icon="📦" label="অর্ডার ম্যানেজমেন্ট (Orders)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="pos" icon="💻" label="পিওএস বিক্রয় (POS Sales)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="expenses" icon="💸" label="ব্যবসার খরচ (Expenses)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="customers" icon="👥" label="গ্রাহক তালিকা (Customers)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="suppliers" icon="🚚" label="সাপ্লায়ার ম্যানেজমেন্ট" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="finance" icon="💰" label="আর্থিক হিসাব (Finance)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="profit" icon="📈" label="প্রফিট অ্যানালিটিক্স (Profit)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="reports" icon="📋" label="রিপোর্ট ও এক্সপোর্ট (Reports)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="employees" icon="👔" label="কর্মচারী পারমিশন (Staff)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="backup" icon="💾" label="ব্যাকআপ ও রিসেট (Backup)" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <NavItem id="settings" icon="⚙️" label="বিজনেস সেটিং (Settings)" activeTab={activeTab} setActiveTab={setActiveTab} />
                            </nav>
                        </div>

                        <div className="p-4 border-t border-slate-800 text-xs text-slate-400 bg-slate-950 flex justify-between items-center">
                            <span>মুদ্রা: BDT (৳)</span>
                            <span className="text-emerald-400 font-semibold">● অনলাইন</span>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col md:pl-64 overflow-y-auto">
                        {/* Header */}
                        <header className="h-16 bg-slate-900/60 backdrop-blur border-b border-slate-800 sticky top-0 z-40 flex items-center justify-between px-6">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setMobileMenuOpen(true)} className="md:hidden text-slate-300 text-xl">☰</button>
                                <h2 className="text-lg font-bold text-white capitalize">{activeTab} মডিউল</h2>
                            </div>
                            <div className="flex items-center gap-3">
                                <input type="text" placeholder="গ্লোবাল সার্চ (SKU, অর্ডার, নাম)..." className="bg-slate-950 border border-slate-800 text-xs px-3 py-1.5 rounded-lg w-48 md:w-64 focus:outline-none focus:border-blue-500" />
                                <span className="text-xs bg-amber-950 text-amber-400 border border-amber-800 px-2.5 py-1 rounded-md font-medium">Owner (অনার মোড)</span>
                            </div>
                        </header>

                        {/* Module Content Switcher */}
                        <main className="p-6">
                            {activeTab === 'dashboard' && <DashboardView orders={orders} products={products} expenses={expenses} />}
                            {activeTab === 'products' && <ProductsView products={products} setProducts={setProducts} />}
                            {activeTab === 'inventory' && <InventoryView products={products} />}
                            {activeTab === 'orders' && <OrdersView orders={orders} setOrders={setOrders} />}
                            {activeTab === 'pos' && <PosView products={products} />}
                            {activeTab === 'expenses' && <ExpensesView expenses={expenses} setExpenses={setExpenses} />}
                            {activeTab === 'customers' && <CustomersView orders={orders} />}
                            {activeTab === 'suppliers' && <SuppliersView />}
                            {activeTab === 'finance' && <FinanceView orders={orders} expenses={expenses} />}
                            {activeTab === 'profit' && <ProfitView orders={orders} expenses={expenses} />}
                            {activeTab === 'reports' && <ReportsView />}
                            {activeTab === 'employees' && <EmployeesView />}
                            {activeTab === 'backup' && <BackupView />}
                            {activeTab === 'settings' && <SettingsView />}
                        </main>
                    </div>
                </div>
            );
        }

        // Sub-Components / Navigation Button
        function NavItem({ id, icon, label, activeTab, setActiveTab }) {
            const isActive = activeTab === id;
            return (
                <button onClick={() => setActiveTab(id)} className={`w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition flex items-center gap-2.5 ${isActive ? 'bg-blue-600 text-white font-semibold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                    <span>{icon}</span>
                    <span>{label}</span>
                </button>
            );
        }

        // MODULE 01: DASHBOARD
        function DashboardView({ orders, products, expenses }) {
            const totalRev = orders.reduce((acc, curr) => acc + curr.total, 0);
            const totalExp = expenses.reduce((acc, curr) => acc + curr.amount, 0);
            return (
                <div className="space-y-6">
                    <h3 className="text-xl font-bold text-white">আজকের ব্যবসার রিয়েল-টাইম সামারি</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <Card title="আজকের মোট বিক্রয়" value={`৳ ${totalRev}`} color="border-blue-500" />
                        <Card title="মোট অর্ডার" value={`${orders.length} টি`} color="border-emerald-500" />
                        <Card title="আজকের মোট খরচ" value={`৳ ${totalExp}`} color="border-rose-500" />
                        <Card title="আনুমানিক নিট লাভ" value={`৳ ${totalRev - totalExp}`} color="border-amber-500" />
                    </div>
                </div>
            );
        }

        // MODULE 02 & 03: PRODUCTS & SIZE MATRIX
        function ProductsView({ products, setProducts }) {
            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h3 className="text-xl font-bold text-white">পণ্য ও সাইজ ভ্যারিয়েন্ট ম্যাট্রিক্স</h3>
                        <button className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-medium">+ নতুন পোশাক যোগ করুন</button>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                        <table className="w-full text-left text-xs border-collapse">
                            <thead className="bg-slate-950 text-slate-400">
                                <tr>
                                    <th className="p-3">পণ্যের নাম</th>
                                    <th className="p-3">SKU</th>
                                    <th className="p-3">ক্যাটাগরি</th>
                                    <th className="p-3">সাইজ & কালার</th>
                                    <th className="p-3">মূল্য</th>
                                    <th className="p-3">স্টক</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {products.map(p => (
                                    <tr key={p.id}>
                                        <td className="p-3 font-semibold text-white">{p.name}</td>
                                        <td className="p-3 text-slate-400">{p.sku}</td>
                                        <td className="p-3 text-slate-300">{p.category}</td>
                                        <td className="p-3"><span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded">{p.size} / {p.color}</span></td>
                                        <td className="p-3 font-semibold text-emerald-400">৳ {p.price}</td>
                                        <td className="p-3"><span className="text-emerald-400 font-bold">{p.stock} টি</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // MODULE 08: INVENTORY
        function InventoryView({ products }) {
            return (
                <div className="space-y-4">
                    <h3 className="text-xl font-bold text-white">ইনভেন্টরি ও স্টক লেজার</h3>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs text-slate-400">
                        প্রতিটি সাইজ ও কালার ভ্যারিয়েন্টের স্টক লেভেল এখান থেকে আপডেট ও স্টক-ইন / স্টক-আউট হিস্ট্রি ট্রাক করা যায়।
                    </div>
                </div>
            );
        }

        // MODULE 09: ORDER MANAGEMENT
        function OrdersView({ orders }) {
            return (
                <div className="space-y-4">
                    <h3 className="text-xl font-bold text-white">অর্ডার তালিকা (Order Management)</h3>
                    <div className="space-y-3">
                        {orders.map(o => (
                            <div key={o.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <p className="font-bold text-white text-sm">{o.customer} <span className="text-slate-400 font-normal">({o.phone})</span></p>
                                    <p className="text-slate-500 mt-0.5">Order ID: {o.id} | চ্যানেল: {o.channel}</p>
                                </div>
                                <div className="text-right">
                                    <p className="font-bold text-emerald-400 text-sm">৳ {o.total}</p>
                                    <span className="bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded text-[10px]">{o.status}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // MODULE 12: POS
        function PosView({ products }) {
            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                    <div className="md:col-span-2 space-y-4">
                        <h3 className="text-xl font-bold text-white">Point of Sale (POS Terminal)</h3>
                        <div className="grid grid-cols-2 gap-3">
                            {products.map(p => (
                                <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-lg hover:border-blue-500 cursor-pointer">
                                    <p className="font-bold text-white">{p.name}</p>
                                    <p className="text-slate-400 mt-1">৳ {p.price} | স্টক: {p.stock}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-4">
                        <h4 className="font-bold text-white text-sm border-b border-slate-800 pb-2">কার্ট (Cart Summary)</h4>
                        <p className="text-slate-500 text-center py-6">কার্ট খালি রয়েছে। পণ্য নির্বাচন করুন।</p>
                    </div>
                </div>
            );
        }

        // MODULE 10: EXPENSES
        function ExpensesView({ expenses }) {
            return (
                <div className="space-y-4">
                    <h3 className="text-xl font-bold text-white">ব্যবসার খরচ খাত</h3>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden text-xs">
                        {expenses.map(e => (
                            <div key={e.id} className="p-3 border-b border-slate-800 flex justify-between">
                                <div>
                                    <p className="font-bold text-white">{e.title}</p>
                                    <p className="text-slate-500">{e.category} | তারিখ: {e.date}</p>
                                </div>
                                <p className="font-bold text-rose-400">৳ {e.amount}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Placeholder Panels for Remaining Modules
        function CustomersView() { return <Panel title="গ্রাহক ডিরেক্টরি (Customer CRM)" text="কাস্টমারদের অর্ডার হিস্ট্রি এবং লাইফটাইম ভ্যালু ট্র্যাকিং।" />; }
        function SuppliersView() { return <Panel title="সাপ্লায়ার ম্যানেজমেন্ট" text="সাপ্লায়ার প্রোফাইল, বকেয়া এবং কাপড়/কাঁচামাল ক্রয়ের হিসাব।" />; }
        function FinanceView() { return <Panel title="আর্থিক লেজার (Finance)" text="ক্যাশ ইন, ক্যাশ আউট, বিকাশ/নগদ ব্যালেন্স এবং ব্যাংক স্টেটমেন্ট।" />; }
        function ProfitView() { return <Panel title="প্রফিট অ্যানালিটিক্স (Profit & Loss)" text="Gross Profit এবং Net Profit হিসাব এবং মার্জিন রিপোর্ট।" />; }
        function ReportsView() { return <Panel title="রিপোর্ট ও এক্সপোর্ট সেন্টার" text="PDF ও CSV ফরম্যাটে দৈনিক/মাসিক রিপোর্ট ডাউনলোড।" />; }
        function EmployeesView() { return <Panel title="কর্মচারী পারমিশন ও অ্যাক্সেস" text="ম্যানেজার, সেলস স্টাফ এবং ইনভেন্টরি স্টাফদের রোল পারমিশন।" />; }
        function BackupView() { return <Panel title="ডাটা ব্যাকআপ ও রিসেট" text="সম্পূর্ণ ডাটাবেস JSON ব্যাকআপ ডাউনলোড এবং রিস্টোর অপশন।" />; }
        function SettingsView() { return <Panel title="বিজনেস সেটিং" text="ব্র্যান্ড নাম, লোগো, ভ্যাট এবং ডেলিভারি চার্জ সেটিংস।" />; }

        function Panel({ title, text }) {
            return (
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-2">
                    <h3 className="text-lg font-bold text-white">{title}</h3>
                    <p className="text-xs text-slate-400">{text}</p>
                </div>
            );
        }

        function Card({ title, value, color }) {
            return (
                <div className={`bg-slate-900 border-l-4 ${color} border-y border-r border-slate-800 p-4 rounded-xl`}>
                    <p className="text-xs text-slate-400">{title}</p>
                    <h4 className="text-2xl font-black text-white mt-1">{value}</h4>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<VyroWearApp />, document.getElementById('root'));
    </script>
</body>
</html>
